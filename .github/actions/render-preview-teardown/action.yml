name: 'Render preview teardown'
description: >-
  Restores the shared Render service to main and deletes the requesting PR's
  Neon branch, but only if that PR still owns the preview slot. Shared by
  preview.yml's restore job (on PR close) and preview-expire.yml (scheduled
  staleness sweep) so the ownership check and teardown logic exist once.

inputs:
  pr-number:
    description: 'PR number whose preview to tear down'
    required: true
  render-api-key:
    required: true
  render-service-id:
    required: true
  render-main-branch:
    required: true
  neon-api-key:
    required: true
  neon-project-id:
    required: true

outputs:
  torn-down:
    description: "'true' if this PR owned the slot and was torn down, 'false' otherwise"
    value: ${{ steps.owner.outputs.restore }}

runs:
  using: composite
  steps:
    - name: Does this PR still own the service?
      id: owner
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = ${{ inputs.pr-number }}
          const { data: deployments } = await github.rest.repos.listDeployments({
            ...context.repo,
            environment: 'render-preview',
            per_page: 1,
          })
          const owner = deployments[0]?.payload?.pr
          if (owner == null) {
            core.info('No preview deployment on record — nothing to tear down.')
            core.setOutput('restore', 'false')
            return
          }
          if (String(owner) !== String(prNumber)) {
            core.info(`Service is serving PR #${owner}, not #${prNumber} — leaving it alone.`)
            core.setOutput('restore', 'false')
            return
          }
          core.setOutput('restore', 'true')

    - name: Restore main and wait for it to go live
      id: restore
      if: steps.owner.outputs.restore == 'true'
      shell: bash
      env:
        RENDER_API_KEY: ${{ inputs.render-api-key }}
        RENDER_SERVICE_ID: ${{ inputs.render-service-id }}
        RENDER_MAIN_BRANCH: ${{ inputs.render-main-branch }}
      run: |
        set -euo pipefail
        source .github/scripts/render-api.sh
        source .github/scripts/wait-for-render-deploy.sh

        # Blanked rather than deleted, for two reasons: the variable stays
        # declared in render.yaml so a blueprint sync cannot decide it is
        # surplus and remove it mid-preview, and runtime.exs treats "" as
        # unset, so the effect is the same fallback to DATABASE_URL_MAIN.
        render_api PUT "/services/$RENDER_SERVICE_ID/env-vars/DATABASE_URL_PR" \
          '{"value": ""}' > /dev/null
        echo "DATABASE_URL_PR cleared — runtime.exs falls back to DATABASE_URL_MAIN"

        render_api PATCH "/services/$RENDER_SERVICE_ID" \
          "$(jq -n --arg b "$RENDER_MAIN_BRANCH" '{branch: $b}')" > /dev/null
        echo "Service now builds $RENDER_MAIN_BRANCH"

        deploy_id="$(render_api POST "/services/$RENDER_SERVICE_ID/deploys" \
          '{"clearCache": "do_not_clear"}' | jq -r '.id')"
        echo "Triggered deploy $deploy_id"

        # Waiting matters: the Neon branch is only safe to delete once the
        # service is provably off it. Render keeps the previous instance
        # serving until the new one is live, and that instance is still
        # pointed at the PR branch.
        wait_for_render_deploy "$deploy_id"

    - name: Delete the Neon branch
      # Only once main is provably live again — if restore failed or timed
      # out, the service may still be pointed here. Keep the branch rather
      # than crash-loop the service, which runs Livedata.Release.migrate/0
      # at boot.
      if: steps.owner.outputs.restore == 'true' && steps.restore.outcome == 'success'
      shell: bash
      env:
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        NEON_PROJECT_ID: ${{ inputs.neon-project-id }}
      run: |
        set -euo pipefail
        branch="pr-${{ inputs.pr-number }}"
        if neonctl branches get "$branch" --project-id "$NEON_PROJECT_ID" --api-key "$NEON_API_KEY" >/dev/null 2>&1; then
          neonctl branches delete "$branch" --project-id "$NEON_PROJECT_ID" --api-key "$NEON_API_KEY"
          echo "Deleted Neon branch $branch"
        else
          echo "No Neon branch $branch to delete."
        fi

    - name: Warn that the Neon branch was left behind
      if: steps.owner.outputs.restore == 'true' && steps.restore.outcome != 'success'
      shell: bash
      run: |
        echo "::warning::Main was not restored, so Neon branch pr-${{ inputs.pr-number }} was kept."
        echo "The service may still be pointed at it. Fix the deploy, then delete with:"
        echo "  neonctl branches delete pr-${{ inputs.pr-number }} --project-id <id>"
