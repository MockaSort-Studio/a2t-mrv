name: preview

# Render's free tier allows a single instance, so there is no separate preview
# service: the one service is temporarily repointed at the pull request's git
# branch and its own Neon branch, then restored to main on close.
#
# The production *database* is never touched. Only two things move:
#   - which git branch the service builds
#   - whether DATABASE_URL_PR is set (see livedata/config/runtime.exs, which
#     prefers it over DATABASE_URL_MAIN)
# and only the PR variable is ever written. Render has no equivalent of Koyeb's
# `DATABASE_URL=@SECRET` indirection, which is why the choice lives in the app.
#
# While a preview is up, the deployed app is PR code, and pushes to main do not
# auto-deploy because the service is pointed elsewhere. Closing or merging the
# PR restores main and redeploys it.
#
# Required credentials. The two API keys must be repository *secrets*; the two
# identifiers may be either secrets or variables, and are read from both.
#   NEON_API_KEY       — secret. Installed for you by Neon's GitHub integration.
#   RENDER_API_KEY     — secret. Render account settings. A deploy hook cannot
#                        substitute: hooks only trigger a build, and this workflow
#                        also has to write an env var, change the service's
#                        branch, and read deploy status.
#   NEON_PROJECT_ID    — secret or variable. Neon's integration makes it a variable.
#   RENDER_SERVICE_ID  — secret or variable. The srv-… id in the dashboard URL.
# Required Render environment variables (set by hand, in the dashboard):
#   DATABASE_URL_MAIN (production; never written here)
#
# Optional repository variables:
#   NEON_PARENT_BRANCH (defaults to the project's default branch)
#   NEON_DATABASE_NAME, NEON_ROLE_NAME (resolved from the branch if unset)
#   RENDER_MAIN_BRANCH (defaults to main)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Only PRs that can actually change what the preview serves. Without this,
    # any PR (docs, terraform, an unrelated workflow) repoints the single
    # shared Render service away from whatever livedata PR was using it.
    paths:
      - livedata/**
      - render.yaml
      - .github/workflows/preview.yml
      - .github/workflows/preview-expire.yml
      - .github/actions/render-preview-teardown/**
      - .github/scripts/render-api.sh
      - .github/scripts/wait-for-render-deploy.sh

env:
  # Either location works. Neon's GitHub integration installs NEON_API_KEY as a
  # secret but NEON_PROJECT_ID as a *variable*, whereas setting both by hand
  # tends to make both secrets — reading both places means it does not matter
  # which route was taken.
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  # Same either-location treatment. Not sensitive — it is visible in the
  # service's dashboard URL — so it lives here rather than being threaded
  # through each step, unlike the two API keys.
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID || vars.RENDER_SERVICE_ID }}
  # Empty by default: neonctl resolves the project's default branch, and the
  # branch's database / role, on its own. Set these only to override.
  NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH }}
  NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
  NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME }}
  RENDER_MAIN_BRANCH: ${{ vars.RENDER_MAIN_BRANCH || 'main' }}
  BRANCH_NAME: pr-${{ github.event.pull_request.number }}

# There is one service. Deploys and restores must not interleave.
concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    # Forks cannot read secrets, and their head branch does not exist in this
    # repo for Render to build from.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      # createDeployment, used to record which PR owns the shared service.
      deployments: write

    steps:
      - name: Check required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          # Without this, a missing Neon key surfaces as neonctl's opaque
          # "Cannot run interactive auth in CI" — it falls back to browser
          # OAuth when it finds no credentials.
          missing=()
          [ -n "${NEON_API_KEY:-}" ] || missing+=("NEON_API_KEY")
          [ -n "${NEON_PROJECT_ID:-}" ] || missing+=("NEON_PROJECT_ID")
          [ -n "${RENDER_API_KEY:-}" ] || missing+=("RENDER_API_KEY")
          [ -n "${RENDER_SERVICE_ID:-}" ] || missing+=("RENDER_SERVICE_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing credentials: ${missing[*]}."
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "The API keys must be secrets; the two IDs may be secrets or variables."
            exit 1
          fi

      # Needed for .github/scripts/render-api.sh, which later steps source.
      - uses: actions/checkout@v4

      - name: Install neonctl
        run: npm install -g neonctl@2

      # One service means one preview at a time, so every other pr-* branch is
      # already detached from it — a leftover from a PR whose close event never
      # ran its restore job (force-closed, workflow cancelled, teardown warned
      # and kept the branch). Neon caps branch count per project, so left to
      # accumulate they eventually make `branches create` below fail outright
      # with "branches limit exceeded". That is why this runs *before* the
      # create and not after: sweeping afterwards cannot rescue the very
      # failure it exists to prevent.
      - name: Sweep superseded preview branches
        run: |
          set -euo pipefail

          # Only pr-<number> — the names this workflow creates. Production and
          # the parent branch never match, so they cannot be swept by accident.
          # $BRANCH_NAME is excluded so a re-run reuses its branch intact.
          stale=$(
            neonctl branches list \
              --project-id "$NEON_PROJECT_ID" \
              --api-key "$NEON_API_KEY" \
              --output json \
            | jq -r --arg keep "$BRANCH_NAME" \
                '.[].name | select(test("^pr-[0-9]+$")) | select(. != $keep)'
          )

          if [ -z "$stale" ]; then
            echo "No superseded preview branches to sweep."
            exit 0
          fi

          # A delete failure is not fatal here: the create below reports the
          # branch list on failure, which is the better diagnostic anyway.
          while read -r branch; do
            [ -n "$branch" ] || continue
            if neonctl branches delete "$branch" \
              --project-id "$NEON_PROJECT_ID" \
              --api-key "$NEON_API_KEY"
            then
              echo "Swept superseded preview branch $branch"
            else
              echo "::warning::Could not delete Neon branch $branch — delete it by hand."
            fi
          done <<< "$stale"

      - name: Create or reuse the Neon branch
        id: neon
        run: |
          set -euo pipefail

          # Reused across pushes to the same PR: recreating on every commit
          # would throw away anything set up by hand while reviewing.
          if neonctl branches get "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --api-key "$NEON_API_KEY" >/dev/null 2>&1; then
            echo "Reusing existing Neon branch $BRANCH_NAME"
          else
            parent_args=()
            if [ -n "${NEON_PARENT_BRANCH:-}" ]; then
              parent_args=(--parent "$NEON_PARENT_BRANCH")
              echo "Branching $BRANCH_NAME off $NEON_PARENT_BRANCH"
            else
              echo "Branching $BRANCH_NAME off the project's default branch"
            fi

            if ! neonctl branches create \
              --project-id "$NEON_PROJECT_ID" \
              --api-key "$NEON_API_KEY" \
              --name "$BRANCH_NAME" \
              "${parent_args[@]}"
            then
              echo "::error::Could not create the Neon branch. Branches in this project:"
              neonctl branches list --project-id "$NEON_PROJECT_ID" --api-key "$NEON_API_KEY" || true
              exit 1
            fi
          fi

          conn_args=()
          [ -n "${NEON_DATABASE_NAME:-}" ] && conn_args+=(--database-name "$NEON_DATABASE_NAME")
          [ -n "${NEON_ROLE_NAME:-}" ] && conn_args+=(--role-name "$NEON_ROLE_NAME")

          # Unpooled: config/runtime.exs does not set `prepare: :unnamed`, and
          # Neon's pooler is PgBouncer in transaction mode, which breaks
          # Postgrex's named prepared statements.
          DB_URL="$(neonctl connection-string "$BRANCH_NAME" \
            --project-id "$NEON_PROJECT_ID" \
            --api-key "$NEON_API_KEY" \
            "${conn_args[@]}" \
            --pooled false)"

          # Strip the query string. Neon appends ?sslmode=require&channel_binding=require,
          # which Ecto's URL parser does not interpret; TLS comes from `ssl: true`
          # in config/runtime.exs. Left on, sslmode lands in the database name.
          DB_URL="${DB_URL%%\?*}"

          echo "::add-mask::$DB_URL"
          echo "db_url=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Point DATABASE_URL_PR at the branch and repoint the service
        id: repoint
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DB_URL: ${{ steps.neon.outputs.db_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          source .github/scripts/render-api.sh

          # DATABASE_URL_MAIN is never referenced in this workflow. Only the PR
          # variable moves, so production's connection string cannot be
          # clobbered — and runtime.exs prefers DATABASE_URL_PR when it is set.
          #
          # Single-key upsert, not the bulk endpoint: replacing the whole env-var
          # list would drop PHX_HOST, SECRET_KEY_BASE and POOL_SIZE.
          render_api PUT "/services/$RENDER_SERVICE_ID/env-vars/DATABASE_URL_PR" \
            "$(jq -n --arg v "$DB_URL" '{value: $v}')" > /dev/null
          echo "DATABASE_URL_PR now points at Neon branch $BRANCH_NAME"

          render_api PATCH "/services/$RENDER_SERVICE_ID" \
            "$(jq -n --arg b "$HEAD_REF" '{branch: $b}')" > /dev/null
          echo "Service now builds $HEAD_REF"

          # Explicit deploy last. Render also auto-deploys on the two changes
          # above; it supersedes queued deploys, so this one wins.
          deploy_id="$(render_api POST "/services/$RENDER_SERVICE_ID/deploys" \
            '{"clearCache": "do_not_clear"}' | jq -r '.id')"
          echo "Triggered deploy $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the preview deploy to go live
        id: wait
        # Downstream steps still need to run on failure — to record and
        # report it — rather than leaving the job to stop here silently.
        continue-on-error: true
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          source .github/scripts/render-api.sh
          source .github/scripts/wait-for-render-deploy.sh
          wait_for_render_deploy "${{ steps.repoint.outputs.deploy_id }}"

      - name: Fetch the service URL
        id: url
        if: steps.wait.outcome == 'success'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          source .github/scripts/render-api.sh
          url="$(render_api GET "/services/$RENDER_SERVICE_ID" '' | jq -r '.url')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record which PR owns the service
        id: deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // Ownership is tracked here rather than in an env var on the Render
            // service, so the restore job can tell whether a newer PR has
            // claimed the shared service since this one opened.
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'render-preview',
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: `PR #${context.issue.number}`,
              payload: { pr: context.issue.number },
            })
            core.setOutput('id', deployment.id)

      - name: Mark deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const live = ${{ steps.wait.outcome == 'success' }}
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: live ? 'success' : 'failure',
              environment_url: live ? '${{ steps.url.outputs.url }}' : undefined,
              description: live ? 'Preview is live' : 'Preview deploy failed',
            })

      - name: Comment on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- livedata-preview -->'
            const live = ${{ steps.wait.outcome == 'success' }}
            const url = '${{ steps.url.outputs.url }}'
            const body = [
              marker,
              live ? '### Preview deployed' : '### Preview deploy failed',
              '',
              live
                ? `**${url}** — building \`${context.payload.pull_request.head.ref}\` against Neon branch \`pr-${context.issue.number}\`, forked from production data.`
                : `The deploy of \`${context.payload.pull_request.head.ref}\` did not go live — see the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              '',
              '- `bin/start` migrates and seeds on boot, so the branch migrates itself.',
              '- **The single free-tier service is shared, so main is not deployed right now.**',
              '  Merging or closing this PR restores main.',
              '- The Neon branch is deleted on close; the production database is untouched.',
              '- Inactive previews are torn down automatically — see preview-expire.yml.',
              '- First request after a quiet period is slow: the service spins down',
              '  after 15 minutes idle and Neon compute suspends after about 5.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }

  restore:
    name: Restore main
    runs-on: ubuntu-latest
    # `closed` covers both a merge and a plain close.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      # listDeployments, to see whether a newer PR claimed the service.
      deployments: read

    steps:
      - name: Check required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "${NEON_API_KEY:-}" ] || missing+=("NEON_API_KEY")
          [ -n "${NEON_PROJECT_ID:-}" ] || missing+=("NEON_PROJECT_ID")
          [ -n "${RENDER_API_KEY:-}" ] || missing+=("RENDER_API_KEY")
          [ -n "${RENDER_SERVICE_ID:-}" ] || missing+=("RENDER_SERVICE_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing credentials: ${missing[*]}."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install neonctl
        run: npm install -g neonctl@2

      - name: Restore main if this PR still owns the service
        uses: ./.github/actions/render-preview-teardown
        with:
          pr-number: ${{ github.event.pull_request.number }}
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          render-service-id: ${{ env.RENDER_SERVICE_ID }}
          render-main-branch: ${{ env.RENDER_MAIN_BRANCH }}
          neon-api-key: ${{ env.NEON_API_KEY }}
          neon-project-id: ${{ env.NEON_PROJECT_ID }}
