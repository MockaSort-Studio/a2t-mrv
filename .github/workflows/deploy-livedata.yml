name: deploy-livedata

# Triggered on every push to main that touches livedata, the devenv build config,
# or the CodeDeploy revision artefacts. Builds the OCI image from devenv.nix,
# pushes to GHCR, then triggers a CodeDeploy deployment on the production EC2
# instance. ValidateService in appspec.yml performs the health check; a failed
# validate triggers automatic rollback.
#
# CodeDeploy infrastructure (application, deployment group, revisions bucket) is
# provisioned by Terraform in terraform/codedeploy.tf and terraform/codedeploy_revisions.tf.
# The `apply` job in terraform.yml must have run at least once after those files were
# committed before this workflow can succeed. Terraform changes (terraform/**) and
# livedata changes trigger separate workflows, so the apply is not a declared `needs:`
# dependency here — ensure any new CodeDeploy resource changes merge and apply before
# a deploy that depends on them.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID      — IAM user or role with CodeDeploy + S3 write access
#   AWS_SECRET_ACCESS_KEY  — corresponding secret key
#
# Optional repository variables (defaults match Terraform-provisioned names):
#   AWS_REGION             — AWS region (default: eu-north-1)
#   CODEDEPLOY_APP_NAME    — CodeDeploy application name (default: a2t-mrv-livedata)
#   CODEDEPLOY_DG_NAME     — CodeDeploy deployment group name (default: a2t-mrv-livedata-dg)

on:
  push:
    branches: [main]
    paths:
      - livedata/**
      - devenv.nix
      - devenv.lock
      - deploy/**
      - appspec.yml
      - scripts/deploy/**
      - .github/workflows/deploy-livedata.yml
  workflow_dispatch:

# One deploy at a time; never cancel in progress — a partial deploy is worse
# than a queued one.
concurrency:
  group: deploy-livedata
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  packages: write
  deployments: write

jobs:
  build-push:
    name: Build and push livedata image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            trusted-users = root runner

      # devenv and its dependencies are cached via the public Cachix binary cache,
      # avoiding a full rebuild of the Nix toolchain on every run.
      - name: Configure Cachix (devenv binary cache)
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install github:cachix/devenv/v2.2.2

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'livedata/mix.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 7G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build livedata OCI image
        # devenv reads containers.livedata from devenv.nix and compiles the Mix
        # release in a Nix sandbox (no network access at build time). `build`
        # only prints the resulting Nix store path — it does not produce a
        # docker-loadable tarball, since nix2container images aren't a `docker
        # save` tar. `container copy --registry docker-daemon:` builds and
        # runs skopeo to load the image directly into the local Docker daemon,
        # tagged livedata:latest (devenv's own `container run` does the same
        # internally to launch a container locally).
        run: |
          devenv container copy livedata --registry docker-daemon:

      - name: Tag and push to GHCR
        id: image
        run: |
          set -euo pipefail
          SHA_TAG="ghcr.io/mockasort-studio/a2t-mrv-livedata:${{ github.sha }}"
          LATEST_TAG="ghcr.io/mockasort-studio/a2t-mrv-livedata:latest"
          docker tag livedata:latest "$SHA_TAG"
          docker tag livedata:latest "$LATEST_TAG"
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          echo "ref=$SHA_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy via CodeDeploy
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      - name: Resolve revisions bucket
        run: |
          set -euo pipefail
          BUCKET=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Role,Values=codedeploy-revisions Key=Project,Values=a2t-mrv \
            --resource-type-filters s3 \
            --query 'ResourceTagMappingList[0].ResourceARN' \
            --output text | sed 's|arn:aws:s3:::||')
          [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ] || \
            { echo "ERROR: no S3 bucket tagged Role=codedeploy-revisions,Project=a2t-mrv found"; exit 1; }
          echo "REVISION_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Write runtime revision files
        # image_ref and ghcr_token are read by the lifecycle hook scripts on the
        # EC2 instance. They are not committed — written here per workflow run.
        # ghcr_token is a short-lived GitHub App token valid for ~10 minutes after
        # the workflow run completes, which is sufficient for the agent to pull.
        env:
          IMAGE_REF: ${{ needs.build-push.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_REF" > scripts/deploy/image_ref
          printf '%s' "$GH_TOKEN" > scripts/deploy/ghcr_token
          chmod 600 scripts/deploy/ghcr_token

      - name: Bundle and upload revision to S3
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zip -r "revision-${COMMIT_SHA}.zip" appspec.yml scripts/deploy/
          aws s3 cp "revision-${COMMIT_SHA}.zip" \
            "s3://${REVISION_BUCKET}/codedeploy-revisions/revision-${COMMIT_SHA}.zip"

      - name: Create CodeDeploy deployment
        env:
          COMMIT_SHA: ${{ github.sha }}
          APP_NAME: ${{ vars.CODEDEPLOY_APP_NAME || 'a2t-mrv-livedata' }}
          DG_NAME: ${{ vars.CODEDEPLOY_DG_NAME || 'a2t-mrv-livedata-dg' }}
        run: |
          set -euo pipefail
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$APP_NAME" \
            --deployment-group-name "$DG_NAME" \
            --s3-location "bucket=${REVISION_BUCKET},key=codedeploy-revisions/revision-${COMMIT_SHA}.zip,bundleType=zip" \
            --description "Workflow run $GITHUB_RUN_ID — $COMMIT_SHA" \
            --output text --query 'deploymentId')
          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment to complete
        # ValidateService in appspec.yml performs the real health check. A failed
        # validate exits non-zero, which triggers the deployment group's
        # AutoRollbackConfiguration and causes this wait to fail the workflow.
        run: |
          set -euo pipefail
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
          echo "Deployment $DEPLOYMENT_ID succeeded."
