name: env-image

on:
  push:
    branches: [main]
    paths:
      - docker/Dockerfile
      - docker/entrypoint.sh
      - .github/workflows/env-image.yml
  pull_request:
    paths:
      - docker/Dockerfile
      - docker/entrypoint.sh
      - .github/workflows/env-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: false
          # build-push (below, via the shared push-container action) already
          # caches this way — build-check was missing it, so every PR rebuilt
          # the whole image from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MockaSort-Studio/actions/.github/actions/push-container@main
        with:
          image-name: mockasort-studio/a2t-mrv-env
          image-description: "CI runner environment for Hall automata — Elixir, PostgreSQL + PostGIS, Node.js"
          dockerfile: docker/Dockerfile
          context: docker
          token: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/mockasort-studio/a2t-mrv-env:latest
            ghcr.io/mockasort-studio/a2t-mrv-env:main
