name: devenv-container-check

# PR gate: builds the livedata OCI image from devenv.nix on every pull request
# that touches the container definition, Elixir app, or deploy stack.
# Build-only — no GHCR push, no SSH deploy. Fails fast on invalid Nix options
# or Mix compilation errors before they can reach the main build-push job.
#
# Mirrors the Nix / devenv / Cachix setup in deploy-livedata.yml's build-push
# job so Cachix cache hits keep runtime comparable to the full deploy path.

on:
  pull_request:
    paths:
      - devenv.nix
      - devenv.lock
      - livedata/**
      - deploy/**
      - .github/workflows/devenv-container-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    name: Build livedata devenv container (PR gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            trusted-users = root runner

      - name: Configure Cachix (devenv binary cache)
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install github:cachix/devenv/latest

      - name: Build livedata OCI image
        # Evaluates and builds containers.livedata from devenv.nix in a Nix
        # sandbox. A bad option (e.g. containers.livedata.config) fails here at
        # evaluation time, blocking merge before main's build-push job runs.
        id: build
        run: |
          path="$(devenv container build livedata)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Built: $path"

      # TEMPORARY — investigating why the image closure is ~6GB. Remove once
      # the bloat source is identified and trimmed.
      - name: Diagnose closure size
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "=== Total closure size ==="
          nix --extra-experimental-features nix-command path-info -S "${{ steps.build.outputs.path }}" | awk '{print $2}'

          echo "=== Top 40 largest paths in the closure ==="
          nix --extra-experimental-features nix-command path-info -rS "${{ steps.build.outputs.path }}" \
            | sort -k2 -n -r | head -40

          echo "=== Why does the closure depend on git? ==="
          git_path="$(nix --extra-experimental-features nix-command path-info -r "${{ steps.build.outputs.path }}" | grep -m1 -- '-git-' || true)"
          if [ -n "$git_path" ]; then
            nix --extra-experimental-features nix-command why-depends "${{ steps.build.outputs.path }}" "$git_path" || true
          else
            echo "git is not in the closure."
          fi

          echo "=== Why does the closure depend on gnupg? ==="
          gnupg_path="$(nix --extra-experimental-features nix-command path-info -r "${{ steps.build.outputs.path }}" | grep -m1 -- '-gnupg-' || true)"
          if [ -n "$gnupg_path" ]; then
            nix --extra-experimental-features nix-command why-depends "${{ steps.build.outputs.path }}" "$gnupg_path" || true
          else
            echo "gnupg is not in the closure."
          fi
