name: preview-expire

# Governs the lifetime of the shared Render preview slot (see preview.yml).
# PR close already restores main immediately — this covers the case that
# leaves for: an open PR that claimed the preview and then went inactive
# (no new commits), so nothing ever triggers preview.yml's restore job.
#
# Policy: warn at WARN_DAYS of inactivity, tear down at EXPIRE_DAYS.
# "Inactivity" is measured from the owning PR's head commit date, not the
# PR's updatedAt — a comment (including this workflow's own warning) bumps
# updatedAt without indicating the developer is still using the preview.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  WARN_DAYS: 7
  EXPIRE_DAYS: 10
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID || vars.RENDER_SERVICE_ID }}
  RENDER_MAIN_BRANCH: ${{ vars.RENDER_MAIN_BRANCH || 'main' }}

concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read
  pull-requests: write

jobs:
  sweep:
    name: Warn or expire the current preview owner
    runs-on: ubuntu-latest
    steps:
      - name: Find the current preview owner
        id: owner
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              ...context.repo,
              environment: 'render-preview',
              per_page: 1,
            })
            const pr = deployments[0]?.payload?.pr
            if (pr == null) {
              core.info('No preview deployment on record — nothing to sweep.')
              core.setOutput('pr', '')
              return
            }
            core.setOutput('pr', String(pr))

      - name: Look up the owning PR
        id: pr
        if: steps.owner.outputs.pr != ''
        uses: actions/github-script@v7
        with:
          script: |
            const number = Number('${{ steps.owner.outputs.pr }}')
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: number,
            })

            // Closed but still recorded as owner means the close event's
            // restore job never ran (cancelled, force-closed) — expire
            // immediately regardless of commit age.
            if (pull.state !== 'open') {
              core.setOutput('closed', 'true')
              core.setOutput('days', '999')
              return
            }
            core.setOutput('closed', 'false')

            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: pull.head.sha,
            })
            const committedAt = new Date(commit.commit.committer.date)
            const days = (Date.now() - committedAt.getTime()) / 86400000
            core.setOutput('days', String(days))

      - name: Decide action
        id: decide
        if: steps.owner.outputs.pr != ''
        env:
          DAYS: ${{ steps.pr.outputs.days }}
        run: |
          set -euo pipefail
          days_int="${DAYS%%.*}"
          if [ "$days_int" -ge "$EXPIRE_DAYS" ]; then
            action=expire
          elif [ "$days_int" -ge "$WARN_DAYS" ]; then
            action=warn
          else
            action=none
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Preview owner PR #${{ steps.owner.outputs.pr }}: ${DAYS} days inactive -> ${action}"

      - uses: actions/checkout@v4
        if: steps.decide.outputs.action == 'expire'

      - name: Install neonctl
        if: steps.decide.outputs.action == 'expire'
        run: npm install -g neonctl@2

      - name: Tear down the expired preview
        if: steps.decide.outputs.action == 'expire'
        uses: ./.github/actions/render-preview-teardown
        with:
          pr-number: ${{ steps.owner.outputs.pr }}
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          render-service-id: ${{ env.RENDER_SERVICE_ID }}
          render-main-branch: ${{ env.RENDER_MAIN_BRANCH }}
          neon-api-key: ${{ env.NEON_API_KEY }}
          neon-project-id: ${{ env.NEON_PROJECT_ID }}

      - name: Comment on the expired PR
        if: steps.decide.outputs.action == 'expire' && steps.pr.outputs.closed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number('${{ steps.owner.outputs.pr }}'),
              body: [
                '<!-- livedata-preview-expired -->',
                `### Preview expired`,
                '',
                `No new commits in ${{ env.EXPIRE_DAYS }}+ days, so the shared preview slot`,
                'was restored to main and this PR\'s Neon branch was deleted.',
                'Push a new commit to reclaim it.',
              ].join('\n'),
            })

      - name: Warn the stale PR
        if: steps.decide.outputs.action == 'warn'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- livedata-preview-stale-warning -->'
            const body = [
              marker,
              '### Preview inactive',
              '',
              `No new commits in ${{ env.WARN_DAYS }}+ days. This PR's preview will be`,
              `torn down (main restored, Neon branch deleted) after ${{ env.EXPIRE_DAYS }} days`,
              'of inactivity unless a new commit is pushed.',
            ].join('\n')

            const number = Number('${{ steps.owner.outputs.pr }}')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body })
            }
