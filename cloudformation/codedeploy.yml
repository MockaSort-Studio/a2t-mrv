AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CodeDeploy application and deployment group for the livedata service.
  Targets EC2 instances tagged CodeDeployApp=livedata (provisioned by Terraform
  in terraform/modules/infra). Revisions are read from the S3 bucket named by
  RevisionsBucketName, which must already grant the EC2 instance role GetObject
  access (the infra Terraform module does this for the storage bucket).

Parameters:
  RevisionsBucketName:
    Type: String
    Description: >
      S3 bucket that stores deployment revision zips (the existing CRCF storage
      bucket, accessed via the codedeploy-revisions/ prefix). Must already grant
      s3:GetObject to the EC2 instance role.

Resources:

  # ── CodeDeploy service role ─────────────────────────────────────────────────
  # Allows the CodeDeploy service to read EC2 instance metadata, write event
  # history, and interact with SNS/CloudWatch for deployment notifications.
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: a2t-mrv-codedeploy-service
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole
      Tags:
        - Key: Project
          Value: a2t-mrv
        - Key: ManagedBy
          Value: cloudformation

  # ── CodeDeploy application ──────────────────────────────────────────────────
  LivedataApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: a2t-mrv-livedata
      ComputePlatform: Server

  # ── CodeDeploy deployment group ─────────────────────────────────────────────
  # Targets all EC2 instances tagged CodeDeployApp=livedata.
  # AutoRollback fires on DEPLOYMENT_FAILURE, restoring the previous revision.
  LivedataDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref LivedataApplication
      DeploymentGroupName: a2t-mrv-livedata-dg
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      Ec2TagFilters:
        - Key: CodeDeployApp
          Value: livedata
          Type: KEY_AND_VALUE
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
      DeploymentStyle:
        DeploymentType: IN_PLACE
        DeploymentOption: WITHOUT_TRAFFIC_CONTROL

Outputs:
  ApplicationName:
    Description: CodeDeploy application name — pass as CODEDEPLOY_APP_NAME in the deploy workflow.
    Value: !Ref LivedataApplication

  DeploymentGroupName:
    Description: CodeDeploy deployment group name — pass as CODEDEPLOY_DG_NAME in the deploy workflow.
    Value: !GetAtt LivedataDeploymentGroup.DeploymentGroupName

  ServiceRoleArn:
    Description: ARN of the CodeDeploy IAM service role.
    Value: !GetAtt CodeDeployServiceRole.Arn
